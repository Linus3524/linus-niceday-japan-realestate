    <!-- 自架字型（public/fonts/），不連 Google，斷網或網路差時也不會退化：
         圖示字型退化會直接把 icon 名稱當文字畫出來，所以全部 preload 先載。
         三個檔都很小（16KB + 26KB + 31KB），且都是首屏就會用到。 -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/material-symbols-rounded-subset.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jost-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-latin.woff2" crossorigin />

    <!-- 中日文字型仍走 Google（依實際用字分片下載，自架整包要好幾 MB）。
         這裡只請求「站內真的用到的字重」：
           Noto Sans TC 400/500/700、Noto Serif TC 400/700、Shippori Mincho 400/500/600。
         先前多請求的 300 字重與整個 Noto Sans JP 家族實測都沒有被使用，
         卻讓這支樣式表膨脹到 536KB（中日文每個字重都會展開上百段 unicode-range）。
         preconnect 先把連線建好，字型才不用等 DNS/TLS。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;700&family=Shippori+Mincho:wght@400;500;600&display=swap"
    />

    <!-- Preload 首屏關鍵視覺（高解析度 1920x1080 原圖橘子場景背景與人物），確保 Retina 螢幕銳利度與首屏加載 speed -->
    <link rel="preload" as="image" href="/hero-bg.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/hero-character.webp" fetchpriority="high" />

    <!-- Open Graph -->

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "RealEstateAgent",
      "name": "LINUS住好日 (株式會社世嘉 Seika)",
      "description": "東京全中文台灣房仲,提供日本租屋、買房、貸款與民宿經營諮詢服務。",
      "areaServed": ["東京都", "神奈川", "埼玉", "千葉", "大阪"],
      "availableLanguage": ["zh-Hant", "ja"]
    }
    </script>
    <script>
      // 手機瀏覽器往下滑時網址列會收合,視窗高度隨之變高,
      // 若首屏直接吃 svh/vh,人物與背景會在滑動途中突然放大。
      // 這裡把「一個視窗高度」鎖成 --app-vh,只有寬度或方向改變時才重算。
      (function () {
        var lockedWidth = -1;
        var locked = false;
        function setAppVh() {
          var h = window.innerHeight;
          // 只有寬度改變(轉向／視窗縮放)才重算;單純變高一律忽略。
          if (!h || (locked && window.innerWidth === lockedWidth)) return;
          lockedWidth = window.innerWidth;
          locked = true;
          document.documentElement.style.setProperty("--app-vh", h / 100 + "px");
        }
        setAppVh();
        window.addEventListener("resize", setAppVh);
        document.addEventListener("DOMContentLoaded", setAppVh);
        window.addEventListener("orientationchange", function () {
          locked = false;
          setTimeout(setAppVh, 300);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
